<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#05000f">
  <meta name="apple-mobile-web-app-title" content="Floor Manager">
  <link rel="manifest" href="manifest.json">
  <title>Floor Manager — Gold Coins Casino</title>
<style>
:root {
  --gold:    #ffd700;
  --gold-dk: #b8860b;
  --green:   #00ff88;
  --blue:    #00cfff;
  --red:     #ff3300;
  --orange:  #ff8800;
  --purple:  #aa66ff;
  --teal:    #00e5cc;
  --bg:      #05000f;
  --bg2:     #0d0022;
  --bg3:     #150035;
  --border:  #2a0055;
  --text:    #e8d8ff;
  --dim:     #776688;
  --danger:  #ff2244;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;overflow:hidden;}

/* ── SPLASH ── */
#splash{
  position:fixed;inset:0;z-index:9999;
  background:radial-gradient(ellipse at center,#1a0030 0%,#05000f 70%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:opacity .8s ease;
}
#splash.fade-out{opacity:0;pointer-events:none;touch-action:none;z-index:-1;}
#splash::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.12) 3px,rgba(0,0,0,.12) 4px);}
.star{position:absolute;border-radius:50%;background:#ffd700;
  animation:twinkle var(--d) ease-in-out infinite var(--delay);}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
#splash-icon{font-size:64px;margin-bottom:16px;filter:drop-shadow(0 0 20px rgba(255,215,0,.5));}
#splash-title{font-size:clamp(10px,3vw,13px);letter-spacing:4px;color:rgba(212,175,55,.5);
  text-transform:uppercase;margin-bottom:4px;}
#splash-name{font-size:clamp(24px,7vw,36px);font-weight:900;color:var(--gold);
  text-align:center;line-height:1.1;letter-spacing:2px;
  text-shadow:0 0 12px #ff8800,0 0 24px #ff4400;margin-bottom:4px;}
#splash-sub{font-size:clamp(8px,2.5vw,11px);letter-spacing:3px;color:rgba(212,175,55,.4);
  text-transform:uppercase;margin-bottom:28px;}
#loading-wrap{width:180px;margin-bottom:12px;}
#loading-track{height:3px;background:rgba(212,175,55,.15);border-radius:2px;overflow:hidden;}
#loading-bar{height:100%;width:0%;
  background:linear-gradient(90deg,#ff4400,#ffd700);
  border-radius:2px;
  animation:load-fill 2.2s cubic-bezier(.4,0,.2,1) forwards .3s;
  box-shadow:0 0 8px #ff8800;}
@keyframes load-fill{from{width:0%}to{width:100%}}
#loading-text{text-align:center;font-size:8px;color:#332244;letter-spacing:2px;
  margin-top:6px;text-transform:uppercase;animation:blink .8s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:.4}50%{opacity:1}}
#splash-ver{position:absolute;bottom:14px;font-size:9px;color:#1a1133;letter-spacing:2px;}

/* ── LOCK SCREEN ── */
#lock-screen{
  position:fixed;inset:0;background:var(--bg);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  z-index:10000;gap:16px;
}
#lock-screen.show{display:flex;}
#lock-title{font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
#lock-logo{font-size:28px;font-weight:900;color:var(--gold);
  text-shadow:0 0 12px #ff8800;letter-spacing:2px;text-align:center;line-height:1.2;}
#lock-sub{font-size:10px;color:var(--dim);letter-spacing:2px;}
#pin-dots{display:flex;gap:10px;margin:8px 0;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold-dk);
  background:transparent;transition:background .15s;}
.pin-dot.filled{background:var(--gold);}
#pin-error{color:var(--danger);font-size:11px;height:14px;}
#username-field{width:200px;padding:10px 12px;background:#0d0d1a;
  border:1.5px solid var(--gold-dk);border-radius:8px;
  color:var(--gold);font-size:13px;text-align:center;outline:none;letter-spacing:1px;}
#username-field::placeholder{color:var(--dim);letter-spacing:1px;}
#username-field:focus{border-color:var(--gold);}
#pin-grid{display:grid;grid-template-columns:repeat(3,64px);gap:10px;}
.pkey{height:56px;border-radius:10px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--text);font-size:20px;font-weight:bold;
  cursor:pointer;transition:background .1s,transform .08s;
  display:flex;align-items:center;justify-content:center;}
.pkey:active{background:var(--bg3);transform:scale(.94);}
.pkey.wide{grid-column:span 2;font-size:13px;letter-spacing:1px;color:var(--dim);}
.pkey.enter{background:linear-gradient(135deg,#3a2800,#886600);color:var(--gold);font-size:13px;}

/* ── APP ── */
#app{display:none;flex-direction:column;height:100%;}
#app.visible{display:flex;}

/* ── HEADER ── */
#app-hdr{
  background:linear-gradient(135deg,#0a0010,#200040);
  border-bottom:1.5px solid var(--gold-dk);
  padding:10px 14px 8px;flex-shrink:0;
}
#app-hdr-top{display:flex;justify-content:space-between;align-items:center;}
#app-title{font-size:11px;letter-spacing:2px;color:var(--gold);text-transform:uppercase;}
#conn-badge{font-size:9px;padding:2px 8px;border-radius:10px;letter-spacing:1px;}
#conn-badge.ok{background:#003300;color:var(--green);border:1px solid #006600;}
#conn-badge.err{background:#330000;color:var(--danger);border:1px solid #660000;}
#floor-operator{font-size:9px;color:var(--dim);margin-top:2px;letter-spacing:1px;}

/* ── ICON-ONLY TAB BAR — 7 tabs ── */
#tab-bar{
  display:flex;
  border-bottom:1.5px solid var(--border);
  background:var(--bg2);
  flex-shrink:0;
}
.tab{
  flex:1;
  padding:10px 2px 8px;
  text-align:center;
  font-size:18px;
  cursor:pointer;
  border-bottom:2.5px solid transparent;
  transition:all .15s;
  position:relative;
}
.tab.active{border-bottom-color:var(--gold);}
.tab .tab-badge{
  display:none;
  position:absolute;top:5px;right:calc(50% - 14px);
  background:var(--danger);color:#fff;font-size:7px;font-weight:bold;
  border-radius:8px;padding:1px 4px;min-width:14px;text-align:center;
  line-height:1.4;
}
.tab .tab-badge.show{display:block;}

/* ── CONTENT ── */
#tab-content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;}

/* ── SECTIONS ── */
.section{margin-bottom:18px;}
.sec-title{font-size:9px;letter-spacing:2px;color:var(--gold-dk);
  text-transform:uppercase;margin-bottom:8px;padding-bottom:4px;
  border-bottom:1px solid var(--border);}

/* ── STATS GRID ── */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:10px;text-align:center;}
.stat-val{font-size:20px;font-weight:900;color:var(--gold);font-family:'Arial Black',Arial,sans-serif;}
.stat-val.green{color:var(--green);}
.stat-val.orange{color:var(--orange);}
.stat-val.red{color:var(--red);}
.stat-val.purple{color:var(--purple);}
.stat-val.teal{color:var(--teal);}
.stat-lbl{font-size:8px;color:var(--dim);letter-spacing:1px;margin-top:2px;text-transform:uppercase;}

/* ── GAME CARDS ── */
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-bottom:10px;}
.game-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.game-card-name{font-size:13px;font-weight:bold;color:var(--gold);letter-spacing:1px;}
.game-card-badge{font-size:8px;padding:2px 8px;border-radius:8px;letter-spacing:1px;}
.game-card-badge.live{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--green);}
.game-card-badge.idle{background:rgba(255,136,0,.1);border:1px solid rgba(255,136,0,.3);color:var(--orange);}
.game-stats-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px;}
.gs-item{text-align:center;}
.gs-val{font-size:14px;font-weight:900;color:var(--gold);}
.gs-lbl{font-size:7px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;}

/* ── HISTORY RECORDS ── */
.rec-row{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:8px 10px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.rec-row:active{transform:scale(.99);}
.rec-row.spin{border-left:3px solid var(--gold-dk);}
.rec-row.spin.win{border-left-color:var(--green);}
.rec-row.spin.jp{border-left-color:#ff4400;}
.rec-row.cash-in{border-left:3px solid var(--blue);}
.rec-row.cash-out{border-left:3px solid var(--green);}
.rec-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
.rec-type{font-size:11px;font-weight:bold;letter-spacing:1px;color:var(--gold);}
.rec-type.win{color:var(--green);}
.rec-type.jp{color:#ff8800;}
.rec-type.cash-in{color:var(--blue);}
.rec-type.cash-out{color:var(--green);}
.rec-time{font-size:9px;color:var(--dim);}
.rec-detail{font-size:9px;color:rgba(255,255,255,.55);line-height:1.7;}
.rec-detail span{color:rgba(212,175,55,.7);}
.rec-expand{display:none;margin-top:8px;padding-top:8px;
  border-top:1px solid var(--border);font-size:9px;
  color:rgba(255,255,255,.55);line-height:1.9;}
.rec-expand span{color:rgba(212,175,55,.7);}
.rec-row.open .rec-expand{display:block;}

/* ── PLAYER CARDS ── */
.player-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;
  padding:10px 12px;margin-bottom:8px;cursor:pointer;}
.player-card-hdr{display:flex;justify-content:space-between;align-items:center;}
.player-name{font-size:14px;font-weight:bold;color:var(--gold);}
.player-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.player-dot.active{background:var(--green);box-shadow:0 0 6px var(--green);}
.player-dot.idle{background:var(--orange);}
.player-meta{font-size:9px;color:var(--dim);margin-top:3px;}
.player-expand{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}
.player-card.open .player-expand{display:block;}
.player-game-section{margin-bottom:10px;}
.player-game-title{font-size:10px;font-weight:bold;color:var(--gold);margin-bottom:5px;letter-spacing:1px;}
.player-stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;}
.player-stat{font-size:9px;color:rgba(255,255,255,.55);}
.player-stat span{color:var(--gold);}
.pattern-tags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.ptag{font-size:7px;padding:1px 6px;border-radius:8px;
  background:rgba(212,175,55,.08);border:1px solid rgba(212,175,55,.2);color:rgba(212,175,55,.7);}

/* ── SEARCH ── */
.search-bar{width:100%;padding:9px 12px;background:var(--bg2);
  border:1.5px solid var(--border);border-radius:8px;
  color:var(--gold);font-size:13px;outline:none;letter-spacing:.5px;margin-bottom:12px;}
.search-bar::placeholder{color:var(--dim);}
.search-bar:focus{border-color:var(--gold-dk);}

/* ── LIVE FEED ── */
.feed-row{display:flex;gap:8px;align-items:center;padding:5px 0;
  border-bottom:1px solid rgba(255,255,255,.05);}
.feed-row:last-child{border-bottom:none;}
.feed-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.feed-text{font-size:10px;color:rgba(255,255,255,.6);flex:1;min-width:0;}
.feed-text strong{color:var(--gold);}
.feed-time{font-size:8px;color:var(--dim);flex-shrink:0;}

/* ── BUTTONS ── */
.btn{padding:10px 16px;border-radius:8px;border:none;font-size:11px;
  font-weight:bold;letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;transition:transform .08s,opacity .1s;-webkit-appearance:none;}
.btn:active{transform:scale(.94);opacity:.85;}
.btn-gold{background:linear-gradient(135deg,#3a2800,#b8860b);color:var(--gold);border:1px solid var(--gold-dk);}
.btn-green{background:linear-gradient(135deg,#003a00,#006600);color:var(--green);border:1px solid #00aa44;}
.btn-blue{background:linear-gradient(135deg,#00001a,#002266);color:var(--blue);border:1px solid #004499;}
.btn-purple{background:linear-gradient(135deg,#1a0035,#440088);color:var(--purple);border:1px solid #6622aa;}
.btn-teal{background:linear-gradient(135deg,#001a18,#004440);color:var(--teal);border:1px solid #006655;}
.btn-danger{background:linear-gradient(135deg,#3a0010,#660022);color:var(--danger);border:1px solid #aa0033;}
.btn-full{width:100%;margin-top:8px;padding:12px;font-size:12px;}

/* ── GAME SELECTOR ── */
.game-sel{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
.game-sel-btn{flex-shrink:0;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--dim);font-size:10px;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;text-align:center;transition:all .15s;-webkit-appearance:none;}
.game-sel-btn.active{background:rgba(212,175,55,.1);border-color:var(--gold-dk);color:var(--gold);}

/* ── INFO ROW ── */
.info-row{display:flex;justify-content:space-between;align-items:center;
  padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:11px;}
.info-row:last-child{border-bottom:none;}
.info-lbl{color:var(--dim);font-size:9px;letter-spacing:1px;text-transform:uppercase;}
.info-val{color:var(--text);font-weight:bold;text-align:right;}
.info-val.gold{color:var(--gold);}
.info-val.green{color:var(--green);}
.info-val.orange{color:var(--orange);}
.info-val.red{color:var(--red);}
.info-val.purple{color:var(--purple);}

/* ── DATA CARD ── */
.data-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-bottom:10px;}
.data-card-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.data-card-title{font-size:12px;font-weight:bold;color:var(--gold);letter-spacing:1px;}
.data-card-sub{font-size:9px;color:var(--dim);letter-spacing:1px;}

/* ── WALLET ── */
.wallet-balance-display{
  background:linear-gradient(135deg,#0d1a00,#1a3300);
  border:1.5px solid #00aa44;border-radius:12px;
  padding:16px;text-align:center;margin-bottom:14px;
}
.wallet-balance-amt{font-size:32px;font-weight:900;color:var(--green);
  font-family:'Arial Black',Arial,sans-serif;text-shadow:0 0 12px rgba(0,255,136,.4);}
.wallet-balance-lbl{font-size:8px;color:#88ccaa;letter-spacing:2px;text-transform:uppercase;margin-top:4px;}
.voucher-row{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.voucher-amt{font-size:15px;font-weight:900;color:var(--green);}
.voucher-meta{font-size:9px;color:var(--dim);margin-top:2px;}
.voucher-status{font-size:8px;padding:2px 8px;border-radius:8px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;}
.voucher-status.available{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--green);}
.voucher-status.redeemed{background:rgba(119,102,136,.1);border:1px solid rgba(119,102,136,.3);color:var(--dim);}

/* ── PROGRESSIVE ── */
.prog-pot-display{
  background:linear-gradient(135deg,#1a0a00,#3a1500);
  border:1.5px solid var(--orange);border-radius:12px;
  padding:16px;text-align:center;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.prog-pot-display::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at center,rgba(255,136,0,.06) 0%,transparent 70%);
  pointer-events:none;
}
.prog-pot-amt{font-size:36px;font-weight:900;color:var(--gold);
  font-family:'Arial Black',Arial,sans-serif;
  text-shadow:0 0 16px rgba(255,136,0,.5),0 0 32px rgba(255,68,0,.3);}
.prog-pot-lbl{font-size:8px;color:rgba(212,175,55,.6);letter-spacing:3px;text-transform:uppercase;margin-top:4px;}
.prog-armed-badge{
  display:inline-block;margin-top:8px;
  padding:3px 12px;border-radius:10px;font-size:9px;font-weight:bold;letter-spacing:2px;
}
.prog-armed-badge.armed{background:rgba(255,34,68,.15);border:1px solid rgba(255,34,68,.4);color:var(--danger);}
.prog-armed-badge.ready{background:rgba(0,255,136,.08);border:1px solid rgba(0,255,136,.2);color:var(--green);}
.prog-hit-row{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;margin-bottom:6px;}
.prog-hit-amt{font-size:16px;font-weight:900;color:var(--orange);}
.prog-hit-meta{font-size:9px;color:var(--dim);margin-top:2px;line-height:1.6;}
.prog-cmd-row{background:var(--bg3);border:1px solid var(--border);border-radius:8px;
  padding:9px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.prog-cmd-status{font-size:8px;padding:2px 8px;border-radius:8px;font-weight:bold;letter-spacing:1px;text-transform:uppercase;}
.prog-cmd-status.pending{background:rgba(255,136,0,.12);border:1px solid rgba(255,136,0,.3);color:var(--orange);}
.prog-cmd-status.won{background:rgba(0,255,136,.1);border:1px solid rgba(0,255,136,.3);color:var(--green);}
.prog-cmd-status.cancelled{background:rgba(119,102,136,.1);border:1px solid rgba(119,102,136,.3);color:var(--dim);}
.prog-cmd-status.armed{background:rgba(255,34,68,.12);border:1px solid rgba(255,34,68,.3);color:var(--danger);}

/* ── MESSAGES ── */
.msg-type-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.msg-type-btn{padding:5px 10px;border-radius:8px;border:1.5px solid var(--border);
  background:var(--bg2);color:var(--dim);font-size:9px;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer;-webkit-appearance:none;transition:all .15s;}
.msg-type-btn.active-general{background:rgba(0,207,255,.1);border-color:rgba(0,207,255,.4);color:var(--blue);}
.msg-type-btn.active-jackpot{background:rgba(255,136,0,.1);border-color:rgba(255,136,0,.4);color:var(--orange);}
.msg-type-btn.active-event{background:rgba(170,102,255,.1);border-color:rgba(170,102,255,.4);color:var(--purple);}
.msg-type-btn.active-bonus{background:rgba(0,255,136,.1);border-color:rgba(0,255,136,.4);color:var(--green);}
.msg-compose-area{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;
  padding:10px 12px;width:100%;font-size:12px;color:var(--text);
  outline:none;resize:none;font-family:Arial,sans-serif;margin-bottom:8px;letter-spacing:.3px;}
.msg-compose-area::placeholder{color:var(--dim);}
.msg-compose-area:focus{border-color:var(--gold-dk);}
.msg-subject-input{background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;
  padding:9px 12px;width:100%;font-size:12px;color:var(--text);
  outline:none;font-family:Arial,sans-serif;margin-bottom:8px;letter-spacing:.3px;}
.msg-subject-input::placeholder{color:var(--dim);}
.msg-subject-input:focus{border-color:var(--gold-dk);}
.msg-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:12px;margin-bottom:8px;}
.msg-item-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.msg-item-subject{font-size:12px;font-weight:bold;color:var(--text);flex:1;min-width:0;padding-right:8px;}
.msg-item-type{font-size:7px;padding:2px 7px;border-radius:6px;font-weight:bold;letter-spacing:1px;
  text-transform:uppercase;flex-shrink:0;}
.msg-item-type.general{background:rgba(0,207,255,.1);border:1px solid rgba(0,207,255,.3);color:var(--blue);}
.msg-item-type.jackpot{background:rgba(255,136,0,.1);border:1px solid rgba(255,136,0,.3);color:var(--orange);}

var CACHE_VER         = 'floor-v2.3';

var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkbW1vZWdna3FzdnFucXlydWJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4MDYzNTQsImV4cCI6MjA5NjM4MjM1NH0.i86afL3CMpmru4z3LZAbCJkxBiwo25QbwEji8tDBAis';

function _hashPin(pin) {
  var s = pin + 'TSGC_FLOOR_SALT';

   ══════════════════════════════════════════════════════════════════════ */
var GAME_ALIASES = { 'tsbigmunny': 'turrelle', 'maxines': 'maxine' };
function _canonGame(id) { return GAME_ALIASES[id] || id; }

function loadGameRegistry(client, done) {
  if (!client) { if (done) done(false); return; }
  client.from('games').select('*').order('sort_order', {ascending:true})
    .then(function(r) {
      if (r.error || !r.data || !r.data.length) {
        console.warn('[games] falling back to built-in registry:',
                     r.error ? r.error.message : 'empty');
        if (done) done(false); return;
      }
      var next = {};
      for (var i = 0; i < r.data.length; i++) {
        var g = r.data[i];
        if (g.active === false) continue;
        next[g.game_id] = {
          title: g.title, short: g.short_name, cls: g.game_class,
          denom: parseFloat(g.denom) || 1, color: g.color || '#888',
          sort: g.sort_order
        };
      }
      GAMES = next;
      console.log('[games] registry loaded from Supabase:',
                  Object.keys(GAMES).length + ' games');
      return client.from('game_aliases').select('alias,game_id');
    })
    .then(function(r) {
      if (r && !r.error && r.data) {
        for (var i = 0; i < r.data.length; i++)
          GAME_ALIASES[r.data[i].alias] = r.data[i].game_id;
      }
      if (done) done(true);
    })
    .catch(function(e) {
      console.warn('[games] registry load failed, using fallback:', e && e.message);
      if (done) done(false);
    });
}

/* ── PIN ── */
function pk(d) {
  if (_pinBuf.length >= 4) return;
  _pinBuf += d; updateDots();
  if (_pinBuf.length === 4) setTimeout(pkEnter, 80);
}
function pkClear() { _pinBuf = ''; updateDots(); document.getElementById('pin-error').textContent = ''; }
function pkEnter() {

    document.getElementById('pin-error').textContent = 'Enter your name first';
    _pinBuf = ''; updateDots(); return;
  }
  if (_hashPin(_pinBuf) === FLOOR_PIN_HASH) {
    _operatorName = username;
    document.getElementById('lock-screen').classList.remove('show');
    document.getElementById('floor-operator').textContent = 'Floor: ' + username;
    document.getElementById('app').classList.add('visible');
    _activeTab = 'dashboard';
    renderTab();
    _startAutoRefresh();
    startWalletPolling();
    startProgressivePolling();
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    _pinBuf = ''; updateDots();
  }
}
function updateDots() {
  for (var i = 0; i < 4; i++) {
    document.getElementById('d' + i).classList.toggle('filled', i < _pinBuf.length);
  }
}

/* ── SPLASH ── */
function setSplashStatus(msg) {
  var el = document.getElementById('loading-text');
  if (el) el.textContent = msg;
}
function splashError(msg) {
  var bar = document.getElementById('loading-bar');
  if (bar) { bar.style.animation = 'none'; bar.style.width = '100%'; bar.style.background = '#ff3300'; }
  setSplashStatus(msg);

  if (el) el.style.color = '#ff3300';
  var wrap = document.getElementById('loading-wrap');

    btn.style.cssText = 'margin-top:12px;padding:8px 28px;background:transparent;border:1.5px solid #ffd700;color:#ffd700;font-size:11px;letter-spacing:2px;border-radius:20px;cursor:pointer;display:block;';
    btn.onclick = function() {
      var b = document.getElementById('loading-bar');
      if (b) { b.style.animation = ''; b.style.width = '0%'; b.style.background = ''; }
      var lt = document.getElementById('loading-text');
      if (lt) lt.style.color = '';
      var r = document.getElementById('splash-retry');
      if (r && r.parentNode) r.parentNode.removeChild(r);
      initSupabase();

}
function killSplash() {
  var sp = document.getElementById('splash');

/* ── SUPABASE INIT ── */
function initSupabase() {
  setSplashStatus('Loading SDK\u2026');
  if (window._sbScriptEl && window._sbScriptEl.parentNode) {
    window._sbScriptEl.parentNode.removeChild(window._sbScriptEl);
  }
  window.supabase = undefined;
  var s = document.createElement('script');
  window._sbScriptEl = s;
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.0/dist/umd/supabase.min.js';
  s.onload = function() {
    try {
      setSplashStatus('Connecting\u2026');
      _client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { persistSession: false, detectSessionInUrl: false,
          storage: {
            getItem: function(key){ return null; },
            setItem: function(key,value){},
            removeItem: function(key){}
          }
        }
      });
      _client.from('game_history').select('id').limit(1).then(function(res) {
        if (res.error) { splashError('DB error: ' + res.error.message); return; }
        _connected = true;
        setSplashStatus('Connected \u2713');
        document.getElementById('conn-badge').className = 'ok';
        document.getElementById('conn-badge').textContent = 'LIVE';
        /* v-registry: pull the shared game list from Supabase before the
           first render, so newly added games appear with no redeploy.
           Falls back silently to the built-in map if the table is
           unreachable. */
        wmLoadPlayerList();   /* v2.3: populate the Wallet Manager player picker */
        loadGameRegistry(_client, function(ok) {
          console.log('[games] registry source:', ok ? 'supabase' : 'built-in fallback');
          try { if (typeof renderTab === 'function') renderTab(); } catch(e) {}
        });
        _subscribeRealtime();
        _subscribePresence();
        _subscribeMessages();
        startPlayerRegistryPolling();
        _backfillLiveFeed();
        _fetchMessages();
        setTimeout(killSplash, 800);
      });
    } catch(e) { splashError('Init error: ' + e.message); }
  };
  s.onerror = function() { splashError('SDK load failed'); };
  document.head.appendChild(s);
}

/* ── REALTIME — game_history ── */
function _backfillLiveFeed() {
  if (!_client) return;
  _client.from('game_history')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(10)
    .then(function(res) {
      if (res.error || !res.data) return;
      _liveFeed = res.data;
      if (_activeTab === 'dashboard') { try { renderTab(); } catch(e) {} }
    });
}
function _subscribeRealtime() {
  if (_realtimeCh) { try { _client.removeChannel(_realtimeCh); } catch(e) {} }
  _realtimeCh = _client.channel('floor-history')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'game_history' }, function(p) {
      if (!p.new) return;
      _liveFeed.unshift(p.new);
      if (_liveFeed.length > 20) _liveFeed.length = 20;
      if (p.new.game_id === _selectedGame) _history.unshift(p.new);
      if (_activeTab === 'dashboard' || _activeTab === 'games') { try { renderTab(); } catch(e) {} }
    })
    .subscribe(function(status) {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        setTimeout(_subscribeRealtime, 3000);
      }
    });
}

/* ── REALTIME — progressive ── */
function _subscribeProgressive() {
  if (_progCh) { try { _client.removeChannel(_progCh); } catch(e) {} }
  _progCh = _client.channel('floor-progressive')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'progressive' }, function(p) {
      if (!p.new) return;
      _progRow = p.new;
      if (_activeTab === 'progressive') { try { renderTab(); } catch(e) {} }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'progressive_hits' }, function(p) {
      if (!p.new) return;
      _progHits.unshift(p.new);
      if (_activeTab === 'progressive') { try { renderTab(); } catch(e) {} }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'progressive_commands' }, function(p) {
      if (!p.new) return;
      _progCmds.unshift(p.new);
      if (_activeTab === 'progressive') { try { renderTab(); } catch(e) {} }
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'progressive_commands' }, function(p) {
      if (!p.new) return;
      /* Update existing command in cache */
      for (var i = 0; i < _progCmds.length; i++) {
        if (_progCmds[i].id === p.new.id) { _progCmds[i] = p.new; break; }
      }
      if (_activeTab === 'progressive') { try { renderTab(); } catch(e) {} }
    })
    .subscribe(function(status) {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        setTimeout(_subscribeProgressive, 3000);
      }
    });
}

/* ── REALTIME — messages ── */
function _subscribeMessages() {
  if (_msgCh) { try { _client.removeChannel(_msgCh); } catch(e) {} }
  _msgCh = _client.channel('floor-messages')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function(p) {
      if (!p.new) return;
      _messages.unshift(p.new);
      /* Don't count messages we just sent ourselves */
      if (p.new.created_by !== _operatorName) {
        _msgUnread++;
        _updateMsgBadge();
      }
      if (_activeTab === 'messages') { try { renderTab(); } catch(e) {} }
    })
    .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, function(p) {
      if (!p.old) return;
      _messages = _messages.filter(function(m) { return m.id !== p.old.id; });
      if (_activeTab === 'messages') { try { renderTab(); } catch(e) {} }
    })
    .subscribe(function(status) {
      if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        setTimeout(_subscribeMessages, 3000);
      }
    });
}

/* ── PRESENCE ── */
function _subscribePresence() {
  var sessionKey = 'floor_' + Math.random().toString(36).substr(2, 9);
  _doSubscribePresence(sessionKey);
}
function _doSubscribePresence(sessionKey) {
  _presenceCh = _client.channel('presence-lobby', { config: { presence: { key: sessionKey } } });
  function _sync() {
    var state = _presenceCh.presenceState();
    _presenceState = {};
    Object.keys(state).forEach(function(k) {
      var entries = state[k];
      if (entries && entries.length > 0) _presenceState[k] = entries[0];
    });
    if (_activeTab === 'dashboard') { try { renderTab(); } catch(e) {} }
  }
  _presenceCh
    .on('presence', { event: 'sync' }, _sync)
    .on('presence', { event: 'join' }, _sync)
    .on('presence', { event: 'leave' }, _sync)
    .subscribe(function(status) {
      if (status === 'SUBSCRIBED') {
        _floorPresenceRetryDelay = 2000;
        _presenceCh.track({ gameId: 'floor_operator', joinedAt: new Date().toISOString() });
        setTimeout(_sync, 500);
      } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') {
        var _old = _presenceCh;
        var _delay = _floorPresenceRetryDelay;
        _floorPresenceRetryDelay = Math.min(_floorPresenceRetryDelay * 2, 30000);
        setTimeout(function() {
          try {
            var _rm = _client.removeChannel(_old);
            if (_rm && typeof _rm.then === 'function') {
              _rm.then(function(){ _doSubscribePresence(sessionKey); }).catch(function(){ _doSubscribePresence(sessionKey); });
            } else { _doSubscribePresence(sessionKey); }
          } catch(e) { _doSubscribePresence(sessionKey); }
        }, _delay);
      }
    });
}

/* ── PLAYER REGISTRY ── */
function fetchPlayerRegistry() {
  if (!_client) return;
  _client.from('player_registry').select('*').then(function(res) {

    _playerRegistry = res.data || [];
    if (_activeTab === 'dashboard' || _activeTab === 'games' || _activeTab === 'players') renderTab();
  });
}
function startPlayerRegistryPolling() {
  fetchPlayerRegistry();

/* ══════════════════════════════════════════════════════════════════════
   v2.3 — REFRESH GUARD
   renderTab() rewrites #tab-content wholesale via innerHTML, so every
   auto-refresh destroyed expanded rows, scroll position and keyboard focus.
   With three timers running (registry 5s, progressive 10s, dashboard 30s,
   plus a wallet poller) anything you opened closed itself under you.

   Three defences:
     1. isBusy()   — never re-render while the operator is interacting:
                     an input/textarea/select is focused, text is selected,
                     a modal is open, or a row is expanded.
     2. deferred   — a refresh blocked by isBusy() is not lost; it is
                     re-attempted once the operator goes idle.
     3. preserve   — scroll position and focus are restored around any
                     re-render that does happen.
   PAUSE puts the operator in control: nothing auto-refreshes until resumed.
   ══════════════════════════════════════════════════════════════════════ */
var _refreshPaused  = false;
var _refreshDeferred = false;
var _lastInteractAt = 0;
var IDLE_GRACE_MS   = 4000;   /* quiet period after the last interaction */

document.addEventListener('click',  function(){ _lastInteractAt = Date.now(); }, true);
document.addEventListener('keydown',function(){ _lastInteractAt = Date.now(); }, true);
document.addEventListener('input',  function(){ _lastInteractAt = Date.now(); }, true);

function isBusy() {
  if (_refreshPaused) return true;
  if (Date.now() - _lastInteractAt < IDLE_GRACE_MS) return true;
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  var sel = window.getSelection && window.getSelection();
  if (sel && String(sel).length > 0) return true;
  if (document.querySelector('.modal.open, .modal-open, [data-expanded="1"]')) return true;
  return false;
}

/* Re-render only when it is safe; otherwise defer and retry when idle. */
function safeRender() {
  if (isBusy()) {
    _refreshDeferred = true;
    _setRefreshBadge('deferred');
    return false;
  }
  var host = document.getElementById('tab-content');
  var scrollY = window.scrollY || 0;
  var innerY  = host ? host.scrollTop : 0;
  var act = document.activeElement;
  var actId = act && act.id ? act.id : null;
  var selStart = (act && act.selectionStart != null) ? act.selectionStart : null;

  try { renderTab(); } catch(e) { console.warn('[refresh] render failed:', e); }

  window.scrollTo(0, scrollY);
  var host2 = document.getElementById('tab-content');
  if (host2) host2.scrollTop = innerY;
  if (actId) {
    var back = document.getElementById(actId);
    if (back && back.focus) {
      back.focus();
      if (selStart != null && back.setSelectionRange) {
        try { back.setSelectionRange(selStart, selStart); } catch(e) {}
      }
    }
  }
  _refreshDeferred = false;
  _setRefreshBadge('live');
  return true;
}

/* Flush a deferred refresh once the operator stops interacting. */
setInterval(function() {
  if (_refreshDeferred && !isBusy()) safeRender();
}, 1000);

function toggleRefreshPause() {
  _refreshPaused = !_refreshPaused;
  _setRefreshBadge(_refreshPaused ? 'paused' : 'live');
  if (!_refreshPaused && _refreshDeferred) safeRender();
}

function _setRefreshBadge(state) {
  var b = document.getElementById('refresh-badge');
  if (!b) return;
  var map = {
    live:     ['\u25cf LIVE',     '#00cfff'],
    paused:   ['\u23f8 PAUSED',   '#ffb020'],
    deferred: ['\u23f3 HOLDING',  '#8a8f98']
  };
  var m = map[state] || map.live;
  b.textContent = m[0];
  b.style.color = m[1];
}

/* ── AUTO REFRESH ── */
function _startAutoRefresh() {
  if (_autoRefresh) clearInterval(_autoRefresh);
  if (_autoRefreshMs <= 0) return;
  _autoRefresh = setInterval(function() {
    if (_activeTab === 'dashboard') safeRender();
  }, _autoRefreshMs);
}

/* ── HELPERS ── */
function _fmtMoney(n) {
  var v = parseFloat(n) || 0;
  var p = v.toFixed(2).split('.');
  p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '$' + p.join('.');
}
function _fmtTime(iso) {
  if (!iso) return '\u2014';
  try { return new Date(iso).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); } catch(e) { return iso; }
}
function _fmtDateTime(iso) {
  if (!iso) return '\u2014';
  try { return new Date(iso).toLocaleString(); } catch(e) { return iso; }
}
function _fmtDateShort(iso) {
  if (!iso) return '\u2014';
  try { return new Date(iso).toLocaleDateString([], {month:'short',day:'numeric',year:'2-digit'}); } catch(e) { return iso; }
}
function _gameName(id) {
  id = _canonGame(id);
  return (GAMES[id] && GAMES[id].title) || id || '\u2014';
}
function _activePlayers() { return _connectedPlayers().length; }
function _calcStats(arr) {
  var spins   = arr.filter(function(r) { return r.event_type === 'SPIN'; });
  var wagered = spins.reduce(function(s,r){ return s+(parseFloat(r.bet)||0);},0);
  var paid    = spins.reduce(function(s,r){ return s+(parseFloat(r.win)||0);},0);
  var cashIn  = arr.filter(function(r){return r.event_type==='CASH_IN';})
                   .reduce(function(s,r){return s+(parseFloat(r.bet)||0);},0);
  var cashOut = arr.filter(function(r){return r.event_type==='CASH_OUT';})
                   .reduce(function(s,r){return s+(parseFloat(r.win)||0);},0);
  var rtp     = wagered > 0 ? (paid / wagered * 100) : 0;
  var jpHits  = arr.filter(function(r){return r.is_progressive;}).length;
  var bigWin  = spins.reduce(function(s,r){return Math.max(s,parseFloat(r.win)||0);},0);
  var patCount = {};
  spins.forEach(function(r) {
    if (r.patterns && r.patterns.length) r.patterns.forEach(function(p){patCount[p]=(patCount[p]||0)+1;});
  });
  var topPat = '\u2014'; var topCount = 0;
  Object.keys(patCount).forEach(function(p){if(patCount[p]>topCount){topCount=patCount[p];topPat=p;}});
  return {spins:spins.length,wagered:wagered,paid:paid,rtp:rtp,cashIn:cashIn,
          cashOut:cashOut,jpHits:jpHits,bigWin:bigWin,topPat:topPat,topCount:topCount};
}

/* ── TAB ROUTING ── */
var _TAB_IDS = ['dashboard','games','players','wallet','progressive','messages','settings'];
function showTab(name) {
  _activeTab = name;
  _openRecIdx = -1;
  _openPlayerIdx = -1;
  /* Update active state */
  _TAB_IDS.forEach(function(t) {
    var el = document.getElementById('tb-' + t);
    if (el) el.classList.toggle('active', t === name);
  });
  /* Clear unread badge when messages tab opened */
  if (name === 'messages') { _msgUnread = 0; _updateMsgBadge(); }
  renderTab();
}
function renderTab() {
  var el = document.getElementById('tab-content');
  if (!el) return;
  if      (_activeTab === 'dashboard')   renderDashboard(el);
  else if (_activeTab === 'games')       renderGames(el);
  else if (_activeTab === 'players')     renderPlayers(el);
  else if (_activeTab === 'wallet')      renderWallet(el);
  else if (_activeTab === 'progressive') renderProgressive(el);
  else if (_activeTab === 'messages')    renderMessages(el);
  else if (_activeTab === 'settings')    renderSettings(el);
}

      if (_progRow.armed) html += '<span style="font-size:8px;color:var(--danger);border:1px solid var(--danger);padding:1px 6px;border-radius:6px;letter-spacing:1px;">ARMED</span>';

      html += '<div class="game-card">';
      html += '<div class="game-card-hdr">';

      html += '</div>';
      html += '<div class="game-stats-row">';
      html += '<div class="gs-item"><div class="gs-val">' + gStats.spins + '</div><div class="gs-lbl">Spins</div></div>';
      html += '<div class="gs-item"><div class="gs-val">' + _fmtMoney(gStats.wagered) + '</div><div class="gs-lbl">Wagered</div></div>';
      html += '<div class="gs-item"><div class="gs-val">' + gStats.rtp.toFixed(1) + '%</div><div class="gs-lbl">RTP</div></div>';
      html += '</div>';
      html += '</div>';
    }
    html += '</div>';

    /* Live feed */
    html += '<div class="section">';
    html += '<div class="sec-title">&#9889; Live Feed</div>';
    if (_liveFeed.length === 0) {
      html += '<div class="empty-state">No events yet</div>';
    } else {
      for (var fi = 0; fi < Math.min(_liveFeed.length, 15); fi++) {
        var r = _liveFeed[fi];
        var dotCol = r.is_progressive ? '#ff8800' : r.win > 0 ? '#00ff88' : '#776688';
        html += '<div class="feed-row">';
        html += '<div class="feed-dot" style="background:' + dotCol + '"></div>';
        html += '<div class="feed-text"><strong>' + (r.nickname || 'Anonymous') + '</strong> &bull; ' + _gameName(r.game_id);
        if (r.event_type === 'SPIN') {
          if (r.is_progressive) html += ' &bull; <span style="color:#ff8800">&#9733; JACKPOT ' + _fmtMoney(r.win) + '</span>';
          else if (r.win > 0) html += ' &bull; WIN ' + _fmtMoney(r.win);
          else html += ' &bull; No bingo';
        } else if (r.event_type === 'CASH_IN')  html += ' &bull; Cash in '  + _fmtMoney(r.bet);
        else if (r.event_type === 'CASH_OUT') html += ' &bull; Cash out ' + _fmtMoney(r.win);
        html += '</div>';
        html += '<div class="feed-time">' + _fmtTime(r.created_at) + '</div>';
        html += '</div>';
      }
    }
    html += '</div>';
    el.innerHTML = html;
  });
}
function _statCard(val, lbl, cls) {

  _openRecIdx = (_openRecIdx === idx) ? -1 : idx;
  var rows = document.querySelectorAll('.rec-row');
  for (var i = 0; i < rows.length; i++) rows[i].classList.toggle('open', i === _openRecIdx);
}
function _exportFallbackTextarea(text) {
  var ta = document.createElement('textarea');
  ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;';
  ta.value = text;
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); toast('Copied to clipboard (Samsung mode)'); }
  catch(e) { toast('Export failed \u2014 screenshot or copy manually'); }
  document.body.removeChild(ta);
}
function exportHistory() {
  if (!_history || _history.length === 0) { toast('No history to export'); return; }
  var gname = GAMES[_selectedGame] ? GAMES[_selectedGame].title : _selectedGame;
  var lines = [];
  lines.push(gname.toUpperCase() + ' \u2014 GAME HISTORY');
  lines.push('Generated: ' + new Date().toLocaleString());
  lines.push('Period: Last 24 Hours');
  lines.push('Records: ' + _history.length);
  lines.push('\u2500'.repeat(60));
  for (var i = 0; i < _history.length; i++) {
    var r = _history[i];
    var line = '[' + r.event_type + '] ' + _fmtDateTime(r.created_at);
    line += ' | Serial: ' + (r.game_serial||'\u2014');
    line += ' | ' + (r.nickname||'Anonymous');
    line += ' | Bet: ' + _fmtMoney(r.bet);
    line += ' | Win: ' + _fmtMoney(r.win);
    line += ' | Bal: ' + _fmtMoney(r.bal_before) + '->' + _fmtMoney(r.bal_after);
    if (r.event_type === 'SPIN') {
      var pats = (r.patterns && r.patterns.length) ? r.patterns.join(', ') : 'NO BINGO';
      line += ' | Patterns: ' + pats;
      if (r.is_progressive) line += ' | *** PROGRESSIVE JACKPOT ' + _fmtMoney(r.prog_amount) + ' ***';
    }
    lines.push(line);
  }
  lines.push('\u2500'.repeat(60));
  var stats = _calcStats(_history);
  lines.push('SUMMARY');
  lines.push('Total Spins: ' + stats.spins + ' | Wagered: ' + _fmtMoney(stats.wagered) + ' | Paid: ' + _fmtMoney(stats.paid) + ' | RTP: ' + stats.rtp.toFixed(2) + '%');
  lines.push('Biggest Win: ' + _fmtMoney(stats.bigWin) + ' | JP Hits: ' + stats.jpHits);
  if (stats.topPat !== '\u2014') lines.push('Top Pattern: ' + stats.topPat + ' x' + stats.topCount);
  var text = lines.join('\n');
  var fname = gname.replace(/\s+/g, '_') + '_' + new Date().toISOString().slice(0,10) + '.txt';
  try {
    var blob = new Blob([text], { type: 'text/plain' });
    var url  = URL.createObjectURL(blob);
    var a    = document.createElement('a');
    a.href = url; a.download = fname; a.click();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    toast('Downloaded ' + fname);
  } catch(e) {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(function(){ toast('Copied to clipboard'); }).catch(function(){ _exportFallbackTextarea(text); });
    } else { _exportFallbackTextarea(text); }
  }
}
function clearHistory() {
  if (!_client || !_connected) { toast('Not connected'); return; }
  if (!confirm('Archive all records for ' + _gameName(_selectedGame) + '?\n\nRecords will be marked archived.')) return;
  var since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
  _client.from('game_history').update({ archived: true }).eq('game_id', _selectedGame).eq('archived', false).gte('created_at', since)
    .then(function(res) {
      if (res.error) { toast('Archive failed: ' + res.error.message); return; }
      _client.from('game_history').delete().eq('game_id', _selectedGame).eq('archived', true)
        .then(function(res2) {
          if (res2.error) console.warn('[Floor] hard delete error:', res2.error.message);
          _history = [];
          toast('History archived for ' + _gameName(_selectedGame));
          renderTab();
        });
    });
}

/* ══════════════════════════════════════════════════════════════════════
   PLAYERS TAB
   ══════════════════════════════════════════════════════════════════════ */
function renderPlayers(el) {
  el.innerHTML = '<input class="search-bar" id="player-search" type="text" placeholder="&#128269; Search nickname\u2026" ' +
    'value="' + _playerSearch + '" oninput="onPlayerSearch(this.value)">' +
    '<div id="players-list"><div class="empty-state">Loading\u2026</div></div>';
  fetchAllHistory(function(all) { _buildPlayersList(all, el); });
}
function onPlayerSearch(val) {
  _playerSearch = val;
  fetchAllHistory(function(all) { _buildPlayersList(all, document.getElementById('tab-content')); });
}
function _buildPlayersList(all, el) {
  var pl = el ? el.querySelector('#players-list') : document.getElementById('players-list');
  if (!pl) return;
  var playerMap = {};
  all.forEach(function(r) {
    var nick = r.nickname || 'Anonymous';
    if (!playerMap[nick]) playerMap[nick] = { nickname: nick, games: {}, lastSeen: r.created_at, firstSeen: r.created_at, allRecords: [] };
    var pm = playerMap[nick];
    pm.allRecords.push(r);
    if (r.created_at > pm.lastSeen)  pm.lastSeen  = r.created_at;
    if (r.created_at < pm.firstSeen) pm.firstSeen = r.created_at;
    if (!pm.games[r.game_id]) pm.games[r.game_id] = [];
    pm.games[r.game_id].push(r);
  });
  _playerRegistry.forEach(function(p) {
    var nick = p.nickname || ('Player ' + p.player_num);
    if (!playerMap[nick]) playerMap[nick] = { nickname: nick, games: {}, lastSeen: p.last_seen || p.first_seen, firstSeen: p.first_seen, allRecords: [] };
  });
  var players = Object.keys(playerMap).map(function(k){ return playerMap[k]; });
  players.sort(function(a,b){ return (b.lastSeen||'') > (a.lastSeen||'') ? 1 : -1; });
  if (_playerSearch) {
    var q = _playerSearch.toLowerCase();
    players = players.filter(function(p){ return p.nickname.toLowerCase().indexOf(q) >= 0; });
  }
  if (players.length === 0) { pl.innerHTML = '<div class="empty-state">No players found</div>'; return; }
  var activeNicks = {};
  _connectedPlayers().forEach(function(p){ activeNicks[p.nickname || ('Player ' + p.player_num)] = true; });
  var html = '';
  for (var pi = 0; pi < players.length; pi++) html += _renderPlayerCard(players[pi], pi, activeNicks);
  pl.innerHTML = html;
}
function _renderPlayerCard(player, idx, activeNicks) {
  var isOpen   = _openPlayerIdx === idx;
  var isActive = !!activeNicks[player.nickname];
  var gameList = Object.keys(player.games).map(function(gid){
    return _gameName(gid) + ' (' + player.games[gid].filter(function(r){return r.event_type==='SPIN';}).length + ' spins)';
  }).join(', ');
  var html = '';
  html += '<div class="player-card' + (isOpen ? ' open' : '') + '" onclick="togglePlayer(' + idx + ')">';
  html += '<div class="player-card-hdr"><div>';
  html += '<div class="player-name">' + (player.nickname === 'Anonymous' ? '&#128373; Anonymous' : '&#128100; ' + player.nickname) + '</div>';
  html += '<div class="player-meta">Last seen: ' + _fmtTime(player.lastSeen) + '</div>';
  html += '</div><div class="player-dot ' + (isActive ? 'active' : 'idle') + '"></div></div>';
  if (!isOpen) html += '<div style="font-size:9px;color:var(--dim);margin-top:4px;">' + gameList + '</div>';
  html += '<div class="player-expand">';
  html += '<div style="font-size:9px;color:var(--dim);margin-bottom:8px;">First seen: ' + _fmtDateTime(player.firstSeen) + ' &bull; Status: ';
  html += isActive ? '<span style="color:var(--green)">&#9679; Active</span>' : '<span style="color:var(--orange)">&#9679; Idle</span>';
  html += '</div>';
  Object.keys(player.games).forEach(function(gid) {
    var grecs  = player.games[gid];
    var gstats = _calcStats(grecs);
    var cashIn  = grecs.filter(function(r){return r.event_type==='CASH_IN';}).reduce(function(s,r){return s+(parseFloat(r.bet)||0);},0);
    var cashOut = grecs.filter(function(r){return r.event_type==='CASH_OUT';}).reduce(function(s,r){return s+(parseFloat(r.win)||0);},0);
    var patCount = {};
    grecs.forEach(function(r){ if (r.patterns) r.patterns.forEach(function(p){patCount[p]=(patCount[p]||0)+1;}); });
    var topPats = Object.keys(patCount).sort(function(a,b){return patCount[b]-patCount[a];}).slice(0,5);
    html += '<div class="player-game-section">';
    html += '<div class="player-game-title">&#127918; ' + _gameName(gid) + '</div>';
    html += '<div class="player-stat-grid">';
    html += '<div class="player-stat">Spins: <span>' + gstats.spins + '</span></div>';
    html += '<div class="player-stat">Wagered: <span>' + _fmtMoney(gstats.wagered) + '</span></div>';
    html += '<div class="player-stat">Won: <span>' + _fmtMoney(gstats.paid) + '</span></div>';
    html += '<div class="player-stat">RTP: <span>' + gstats.rtp.toFixed(1) + '%</span></div>';
    html += '<div class="player-stat">Biggest Win: <span>' + _fmtMoney(gstats.bigWin) + '</span></div>';
    html += '<div class="player-stat">Cash In: <span>' + _fmtMoney(cashIn) + '</span></div>';
    html += '<div class="player-stat">Cash Out: <span>' + _fmtMoney(cashOut) + '</span></div>';
    html += '<div class="player-stat">JP Hits: <span>' + gstats.jpHits + '</span></div>';
    html += '</div>';
    if (topPats.length > 0) {
      html += '<div style="margin-top:6px;font-size:8px;color:var(--dim);letter-spacing:1px;">TOP PATTERNS</div>';
      html += '<div class="pattern-tags">';
      topPats.forEach(function(p){ html += '<div class="ptag">' + p + ' &times;' + patCount[p] + '</div>'; });
      html += '</div>';
    }
    html += '</div>';
  });
  html += '</div></div>';
  return html;
}
function togglePlayer(idx) {
  _openPlayerIdx = (_openPlayerIdx === idx) ? -1 : idx;
  var cards = document.querySelectorAll('.player-card');
  for (var i = 0; i < cards.length; i++) cards[i].classList.toggle('open', i === _openPlayerIdx);
}

/* ══════════════════════════════════════════════════════════════════════
   WALLET TAB — VIEW ONLY
   ══════════════════════════════════════════════════════════════════════ */
function renderWallet(el) {
  /* ══════════════════════════════════════════════════════════════════════
     v2.3 — USER VIRTUAL WALLET MANAGER (replaces the old read-only tab)
     Pick a player, see their balance and vouchers, and edit both:
       • adjust or set balance      • void a voucher
       • change a voucher's amount  • create a voucher
       • toggle redeemed/available
     Every change writes a wallet_audit row. Amounts are validated before
     any write, and destructive actions confirm first.
     ══════════════════════════════════════════════════════════════════════ */
  var html = '';

  if (_walletConfig) {
    html += '<div style="background:rgba(0,207,255,.06);border:1px solid rgba(0,207,255,.15);border-radius:8px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">';
    html += '<span style="font-size:9px;color:var(--blue);letter-spacing:1px;text-transform:uppercase;">Platform Max Voucher</span>';
    html += '<span style="font-size:14px;font-weight:900;color:var(--gold);">' + _fmtMoney(_walletConfig.max_voucher_default) + '</span>';
    html += '</div>';
  }

  /* ── Player picker: known players as chips, plus free text ── */
  html += '<input class="search-bar" id="wallet-search" type="text" placeholder="&#128176; Search or pick a player&hellip;" ' +
          'value="' + (_walletSearch || '') + '" oninput="onWalletSearch(this.value)">';

  var known = _knownPlayers();
  if (known.length) {
    html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px;">';
    for (var k = 0; k < known.length; k++) {
      var act = (_walletSearch && _walletSearch.toLowerCase() === known[k].toLowerCase());
      html += '<button onclick="wmPick(\'' + _escq(known[k]) + '\')" style="' +
              'background:' + (act ? 'rgba(0,207,255,.18)' : 'rgba(255,255,255,.05)') + ';' +
              'border:1px solid ' + (act ? 'rgba(0,207,255,.5)' : 'rgba(255,255,255,.12)') + ';' +
              'color:' + (act ? '#00cfff' : '#c9ced6') + ';border-radius:14px;padding:4px 12px;' +
              'font-size:10px;letter-spacing:.5px;cursor:pointer;">' + _escHtml(known[k]) + '</button>';

  }

  if (!_walletSearch) {
    html += '<div class="empty-state">Pick a player above to view and manage their wallet</div>';

  html += '<div style="font-size:30px;font-weight:900;color:var(--gold);margin:2px 0 2px;">' + _fmtMoney(bal) + '</div>';
  html += '<div style="font-size:10px;color:#8a8f98;">&#9733; ' + _escHtml(nick) +
          (_walletData ? '' : ' &mdash; <span style="color:#ffb020;">no wallet row yet</span>') + '</div>';

  html += '<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;">';
  html += '<input id="wm-amt" type="number" step="0.01" min="0" placeholder="Amount" style="flex:1;min-width:90px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:6px;padding:8px;font-size:13px;">';
  html += '<button onclick="wmAdjust(1)"  style="' + _wmBtn('#1db954') + '">+ ADD</button>';
  html += '<button onclick="wmAdjust(-1)" style="' + _wmBtn('#ff6b6b') + '">&minus; DEDUCT</button>';
  html += '<button onclick="wmSetBalance()" style="' + _wmBtn('#00cfff') + '">SET TO</button>';
  html += '</div>';
  html += '<div style="display:flex;gap:6px;margin-top:6px;">';
  html += '<button onclick="wmNewVoucher()" style="' + _wmBtn('#ffd700') + 'flex:1;">&#43; CREATE VOUCHER</button>';
  html += '</div>';

  /* ── Vouchers ── */
  var vs = _walletVouchers || [];
  var avail = 0, redeemed = 0, availSum = 0;
  for (var i = 0; i < vs.length; i++) {
    if (vs[i].status === 'available') { avail++; availSum += parseFloat(vs[i].amount) || 0; }

              ';border-radius:8px;padding:10px 12px;margin-bottom:6px;">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">';

      html += '</div>';
      html += '<div style="display:flex;gap:5px;margin-top:8px;flex-wrap:wrap;">';
      html += '<button onclick="wmEditVoucher(\'' + v.id + '\',' + (parseFloat(v.amount)||0) + ')" style="' + _wmBtn('#00cfff','9px') + '">EDIT AMOUNT</button>';
      html += '<button onclick="wmToggleVoucher(\'' + v.id + '\',\'' + v.status + '\')" style="' + _wmBtn('#ffb020','9px') + '">' +
              (isAvail ? 'MARK REDEEMED' : 'MAKE AVAILABLE') + '</button>';

function _wmBtn(color, fs) {
  return 'background:rgba(255,255,255,.05);border:1px solid ' + color + '55;color:' + color +
         ';border-radius:6px;padding:7px 11px;font-size:' + (fs || '10px') +
         ';font-weight:900;letter-spacing:.5px;cursor:pointer;';
}
function _escHtml(t) {
  return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function _escq(t) { return String(t == null ? '' : t).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }

/* Players seen anywhere — registry, wallets, or vouchers. */
function _knownPlayers() {
  var set = {};
  (_playerRegistry || []).forEach(function(p) { if (p && p.nickname) set[p.nickname] = 1; });
  (_wmPlayerCache || []).forEach(function(n) { if (n) set[n] = 1; });
  return Object.keys(set).sort();
}

var _wmPlayerCache = [];
function wmLoadPlayerList() {
  if (!_client) return;
  _client.from('wallet').select('nickname').order('nickname')
    .then(function(r) {
      if (!r.error && r.data) {
        _wmPlayerCache = r.data.map(function(x) { return x.nickname; });
        if (_activeTab === 'wallet') safeRender();
      }
    }).catch(function(){});
}

function wmPick(nick) {
  _walletSearch = nick;
  _walletData = undefined;
  renderTab();
  fetchWalletByNickname(nick, function(w, v) {
    _walletData = w; _walletVouchers = v; renderTab();
  });
}

function _wmAmtField() {
  var f = document.getElementById('wm-amt');
  var n = f ? parseFloat(f.value) : NaN;
  if (isNaN(n) || n <= 0) { toast('Enter a valid amount first'); return null; }
  return Math.round(n * 100) / 100;
}

function _wmAudit(action, amount, before, after, vid, note) {
  if (!_client) return;
  _client.from('wallet_audit').insert({
    nickname: _walletSearch, action: action, amount: amount,
    bal_before: before, bal_after: after, voucher_id: vid || null, note: note || null
  }).then(function(){}).catch(function(){});
}

function _wmReload() {
  fetchWalletByNickname(_walletSearch, function(w, v) {
    _walletData = w; _walletVouchers = v; renderTab();
  });
}

/* ── Balance: add / deduct ── */
function wmAdjust(sign) {
  var amt = _wmAmtField(); if (amt === null) return;
  var before = _walletData ? parseFloat(_walletData.balance) || 0 : 0;
  var delta = sign * amt;
  if (delta < 0 && before + delta < 0) {
    if (!confirm('This takes the balance negative (' + _fmtMoney(before + delta) + '). Continue?')) return;
  }
  _client.rpc('wallet_adjust_balance', { p_nickname: _walletSearch, p_delta: delta })
    .then(function(r) {
      if (r.error) { toast('Failed: ' + r.error.message); return; }
      _wmAudit(delta > 0 ? 'BALANCE_ADD' : 'BALANCE_DEDUCT', Math.abs(delta), before, before + delta, null, 'floor manager');
      toast((delta > 0 ? 'Added ' : 'Deducted ') + _fmtMoney(Math.abs(delta)));
      _wmReload();
    }).catch(function(e) { toast('Failed: ' + e.message); });
}

/* ── Balance: set to an explicit value ── */
function wmSetBalance() {
  var amt = _wmAmtField(); if (amt === null) return;
  var before = _walletData ? parseFloat(_walletData.balance) || 0 : 0;
  if (!confirm('Set ' + _walletSearch + " balance to " + _fmtMoney(amt) + '?\n(was ' + _fmtMoney(before) + ')')) return;
  _client.rpc('operator_set_balance', { p_nickname: _walletSearch, p_new_balance: amt, p_reason: 'floor manager set' })
    .then(function(r) {
      if (r.error) { toast('Failed: ' + r.error.message); return; }
      _wmAudit('BALANCE_SET', amt, before, amt, null, 'floor manager set');
      toast('Balance set to ' + _fmtMoney(amt));
      _wmReload();
    }).catch(function(e) { toast('Failed: ' + e.message); });
}

/* ── Vouchers ── */
function wmNewVoucher() {
  var amt = _wmAmtField(); if (amt === null) return;
  var max = _walletConfig ? parseFloat(_walletConfig.max_voucher_default) : null;
  if (max && amt > max && !confirm('Above the platform max of ' + _fmtMoney(max) + '. Create anyway?')) return;
  _client.from('vouchers').insert({
    nickname: _walletSearch, amount: amt, status: 'available', source_game: 'operator'
  }).then(function(r) {
    if (r.error) { toast('Failed: ' + r.error.message); return; }
    _wmAudit('VOUCHER_CREATE', amt, null, null, null, 'operator issued');
    toast('Voucher created: ' + _fmtMoney(amt));
    _wmReload();
  }).catch(function(e) { toast('Failed: ' + e.message); });
}

function wmEditVoucher(vid, current) {
  var raw = prompt('New amount for this voucher:', String(current));
  if (raw === null) return;
  var amt = parseFloat(raw);
  if (isNaN(amt) || amt <= 0) { toast('Invalid amount'); return; }
  amt = Math.round(amt * 100) / 100;
  _client.from('vouchers').update({ amount: amt }).eq('id', vid)
    .then(function(r) {
      if (r.error) { toast('Failed: ' + r.error.message); return; }
      _wmAudit('VOUCHER_EDIT', amt, current, amt, vid, 'amount changed');
      toast('Voucher updated to ' + _fmtMoney(amt));
      _wmReload();
    }).catch(function(e) { toast('Failed: ' + e.message); });
}

function wmToggleVoucher(vid, status) {
  var next = (status === 'available') ? 'redeemed' : 'available';
  var patch = { status: next };
  patch.redeemed_at = (next === 'redeemed') ? new Date().toISOString() : null;
  _client.from('vouchers').update(patch).eq('id', vid)
    .then(function(r) {
      if (r.error) { toast('Failed: ' + r.error.message); return; }
      _wmAudit('VOUCHER_' + next.toUpperCase(), null, null, null, vid, 'status -> ' + next);
      toast('Voucher marked ' + next);
      _wmReload();
    }).catch(function(e) { toast('Failed: ' + e.message); });
}

function wmVoidVoucher(vid) {
  if (!confirm('Void this voucher? It can no longer be redeemed.')) return;
  _client.from('vouchers').update({ status: 'void' }).eq('id', vid)
    .then(function(r) {
      if (r.error) { toast('Failed: ' + r.error.message); return; }
      _wmAudit('VOUCHER_VOID', null, null, null, vid, 'voided by operator');
      toast('Voucher voided');
      _wmReload();
    }).catch(function(e) { toast('Failed: ' + e.message); });
}

var _walletSearchTimer = null;
function onWalletSearch(val) {
  _walletSearch = val.trim();
  _walletData = undefined; /* undefined = searching, null = not found */
  clearTimeout(_walletSearchTimer);
  if (!_walletSearch) { _walletData = null; renderTab(); return; }
  _walletSearchTimer = setTimeout(function() {
    fetchWalletByNickname(_walletSearch, function(w, v) {
      _walletData = w; /* null if not found */
      _walletVouchers = v;
      if (_activeTab === 'wallet') renderTab();
    });
  }, 400);
}

   PROGRESSIVE TAB — VIEW ONLY

    html += '<div class="prog-pot-lbl">Current Jackpot Pot</div>';

    html += '<div class="prog-armed-badge ' + (armedState ? 'armed' : 'ready') + '">' + (armedState ? '&#9888; ARMED' : '&#9899; READY') + '</div>';

    /* Config details */
    html += '<div class="data-card">';
    html += '<div class="data-card-hdr"><div class="data-card-title">&#9881; Configuration</div><div class="data-card-sub">Read-only &mdash; edit in Prog. Operator</div></div>';
    html += '<div class="info-row"><span class="info-lbl">Seed</span><span class="info-val gold">' + _fmtMoney(_progRow.seed) + '</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Ceiling</span><span class="info-val gold">' + _fmtMoney(_progRow.ceiling) + '</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Contrib Rate</span><span class="info-val">' + (parseFloat(_progRow.contrib_rate) * 100).toFixed(1) + '%</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Trigger Odds</span><span class="info-val">1 in ' + (_progRow.trigger_odds || '\u2014') + '</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Total Hits</span><span class="info-val orange">' + (_progRow.hit_count || 0) + '</span></div>';
    html += '<div class="info-row"><span class="info-lbl">Last Updated</span><span class="info-val">' + _fmtTime(_progRow.updated_at) + '</span></div>';
    html += '</div>';
  }
  html += '</div>';

  /* Recent hits */
  html += '<div class="section">';
  html += '<div class="sec-title">&#9733; Recent Jackpot Hits (' + _progHits.length + ')</div>';

    html += '<div style="font-size:11px;color:var(--dim);padding:10px 0;">No hits in the last 30 days</div>';

    _progHits.forEach(function(h) {
      html += '<div class="prog-hit-row">';

      html += '<div class="prog-hit-meta">';
      html += (h.player_label || h.player_session || 'Unknown') + ' &bull; ' + _gameName(h.game_id) + '<br>';
      html += (h.pattern || '\u2014') + ' &bull; ' + (h.balls ? h.balls + ' balls' : '') + ' &bull; ' + _fmtDateTime(h.created_at);
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  /* Command history */
  html += '<div class="section">';
  html += '<div class="sec-title">&#128195; Command History (' + _progCmds.length + ')</div>';
  if (_progCmds.length === 0) {
    html += '<div style="font-size:11px;color:var(--dim);padding:10px 0;">No commands on record</div>';
  } else {
    _progCmds.forEach(function(cmd) {
      html += '<div class="prog-cmd-row">';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-size:11px;font-weight:bold;color:var(--text);margin-bottom:3px;">' + (cmd.command || '\u2014') + '</div>';
      html += '<div style="font-size:9px;color:var(--dim);line-height:1.6;">';
      html += 'By: ' + (cmd.created_by || '\u2014') + ' &bull; ' + _fmtDateTime(cmd.armed_at);
      if (cmd.winner_label || cmd.winner_session) html += '<br>Winner: ' + (cmd.winner_label || cmd.winner_session);
      if (cmd.winner_amt)  html += ' &bull; ' + _fmtMoney(cmd.winner_amt);

      html += '</div>';
    });
  }
  html += '</div>';

  el.innerHTML = html;
}

/* ══════════════════════════════════════════════════════════════════════
   MESSAGES TAB
   ══════════════════════════════════════════════════════════════════════ */
function renderMessages(el) {
  var html = '';

  /* Compose panel */
  if (_msgComposing) {
    html += '<div class="data-card" style="border-color:rgba(0,207,255,.25);">';
    html += '<div class="data-card-hdr">';
    html += '<div class="data-card-title">&#9997; New Message</div>';
    html += '<button class="btn" style="padding:5px 12px;font-size:10px;background:transparent;border:1px solid var(--border);color:var(--dim);" onclick="msgCancelCompose()">Cancel</button>';
    html += '</div>';

    /* Type selector */
    html += '<div class="msg-type-row">';
    var types = ['general','jackpot','event','bonus'];
    var typeIcons = { general:'&#128226;', jackpot:'&#9733;', event:'&#127881;', bonus:'&#127873;' };
    types.forEach(function(t) {
      var isCur = _msgDraftType === t;
      html += '<button class="msg-type-btn' + (isCur ? ' active-' + t : '') + '" onclick="msgSetType(\'' + t + '\')">' + typeIcons[t] + ' ' + t.toUpperCase() + '</button>';
    });
    html += '</div>';

    html += '<input class="msg-subject-input" id="msg-subject-inp" type="text" placeholder="Subject line\u2026" maxlength="120" value="' + _escHtml(_msgDraftSubject) + '" oninput="msgSubjectChange(this.value)">';
    html += '<textarea class="msg-compose-area" id="msg-body-inp" rows="4" placeholder="Message body\u2026" oninput="msgBodyChange(this.value)">' + _escHtml(_msgDraftBody) + '</textarea>';
    html += '<button class="btn btn-blue btn-full" onclick="msgSend()">&#128232; Send Message</button>';
    html += '</div>';
  } else {
    html += '<button class="btn btn-blue btn-full" onclick="msgStartCompose()" style="margin-bottom:14px;">&#9997; Compose New Message</button>';
  }

  /* Message inbox */
  html += '<div class="section">';
  html += '<div class="sec-title">&#128179; Message Board (' + _messages.length + ')</div>';
  if (_messages.length === 0) {
    html += '<div class="empty-state">No messages yet</div>';
  } else {
    _messages.forEach(function(m) {
      var dismissCount = Array.isArray(m.dismissed_by) ? m.dismissed_by.length : (m.dismissed_by ? JSON.parse(m.dismissed_by).length : 0);
      html += '<div class="msg-item">';
      html += '<div class="msg-item-hdr">';
      html += '<div class="msg-item-subject">' + _escHtml(m.subject || '(no subject)') + '</div>';
      html += '<div class="msg-item-type ' + (m.type||'general') + '">' + _msgTypeIcon(m.type) + ' ' + (m.type||'general').toUpperCase() + '</div>';
      html += '</div>';
      html += '<div class="msg-item-body">' + _escHtml(m.message || '') + '</div>';
      html += '<div class="msg-item-footer">';
      html += '<div class="msg-item-meta">By ' + (m.created_by||'\u2014') + ' &bull; ' + _fmtDateTime(m.created_at) + ' &bull; ' + dismissCount + ' dismissed</div>';
      html += '<button class="btn btn-danger" style="padding:4px 10px;font-size:9px;margin:0;" onclick="msgDelete(' + m.id + ')">&#128465; Delete</button>';
      html += '</div>';
      html += '</div>';
    });
  }
  html += '</div>';

  el.innerHTML = html;
}

function _escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function msgStartCompose() { _msgComposing = true; renderTab(); }
function msgCancelCompose() { _msgComposing = false; _msgDraftSubject = ''; _msgDraftBody = ''; _msgDraftType = 'general'; renderTab(); }
function msgSetType(t) { _msgDraftType = t; renderTab(); setTimeout(function(){ var b=document.getElementById('msg-body-inp'); if(b) b.value = _msgDraftBody; var s=document.getElementById('msg-subject-inp'); if(s) s.value = _msgDraftSubject; }, 0); }
function msgSubjectChange(v) { _msgDraftSubject = v; }
function msgBodyChange(v) { _msgDraftBody = v; }
function msgSend() {
  if (!_client || !_connected) { toast('Not connected'); return; }
  var subj = (_msgDraftSubject || '').trim();
  var body = (_msgDraftBody   || '').trim();
  /* Read live from DOM in case state missed an update */
  var sEl = document.getElementById('msg-subject-inp');
  var bEl = document.getElementById('msg-body-inp');
  if (sEl) subj = sEl.value.trim();
  if (bEl) body = bEl.value.trim();
  if (!body) { toast('Message body is required'); return; }
  var row = {
    type:       _msgDraftType || 'general',
    subject:    subj,
    message:    body,
    created_by: _operatorName,
    dismissed_by: []
  };
  _client.from('messages').insert([row]).then(function(res) {
    if (res.error) { toast('Send failed: ' + res.error.message); return; }
    toast('Message sent');
    _msgComposing   = false;
    _msgDraftSubject = '';
    _msgDraftBody    = '';
    _msgDraftType    = 'general';
    /* Optimistically add to local cache */
    var newMsg = Object.assign({}, row, { id: Date.now(), created_at: new Date().toISOString() });
    _messages.unshift(newMsg);
    renderTab();
  });
}
function msgDelete(id) {
  if (!_client || !_connected) { toast('Not connected'); return; }
  if (!confirm('Permanently delete this message?\n\nThis removes it for all players.')) return;
  _client.from('messages').delete().eq('id', id).then(function(res) {
    if (res.error) { toast('Delete failed: ' + res.error.message); return; }
    _messages = _messages.filter(function(m){ return m.id !== id; });
    toast('Message deleted');
    renderTab();
  });
}

      (active ? '' : 'background:var(--bg2);border:1px solid var(--border);color:var(--dim);') +

  html += '<div class="info-row"><span class="info-lbl">Project</span><span class="info-val" style="font-size:9px;">gdmmoeggkqsvqnqyrubx</span></div>';
  html += '<div class="info-row"><span class="info-lbl">Cache</span><span class="info-val" style="font-size:9px;">' + CACHE_VER + '</span></div>';
  html += '</div>';
  html += '</div>';

  html += '<div class="section">';
  html += '<div class="sec-title" style="color:#ff4444;">&#9888; Danger Zone</div>';
  html += '<button class="btn btn-danger btn-full" onclick="archiveAll()">Archive All Records (All Games)</button>';
  html += '<button class="btn btn-danger btn-full" style="margin-top:8px" onclick="hardDeleteArchived()">Hard Delete All Archived Records</button>';
  html += '</div>';

  html += '<div class="section">';
  html += '<div class="sec-title">&#8505; About</div>';
  html += '<div class="data-card">';
  html += '<div class="info-row"><span class="info-lbl">Version</span><span class="info-val gold">v2.0</span></div>';
  html += '<div class="info-row"><span class="info-lbl">Operator</span><span class="info-val">' + _operatorName + '</span></div>';
  html += '<div class="info-row"><span class="info-lbl">Platform</span><span class="info-val">Gold Coins Casino</span></div>';
  html += '<div class="info-row"><span class="info-lbl">Company</span><span class="info-val">Stray-Pup LLC</span></div>';
  html += '</div>';
  html += '<div style="font-size:9px;color:var(--dim);margin-top:8px;line-height:1.8;">';
  html += 'Games: Stray Pups Big Munny $1 &bull; Stray Pups Big Munny $5<br>';
  html += 'The Turrelle Sisters Big Munny &bull; Maxine\'s Wild Cherries &bull; Poke-Her<br>';
  html += 'History: 24-hour rolling window &bull; Prog. poll: 10s &bull; Wallet poll: 15s';
  html += '</div>';
  html += '</div>';

  el.innerHTML = html;
}
function setRefresh(ms) {
  _autoRefreshMs = ms;
  _startAutoRefresh();
  toast('Auto-refresh: ' + (ms > 0 ? (ms / 1000) + 's' : 'off'));
  renderTab();
}
function archiveAll() {
  if (!_client || !_connected) { toast('Not connected'); return; }
  if (!confirm('DANGER: Archive ALL records across ALL games?\n\nThis cannot be undone and affects every game simultaneously.\n\nType CONFIRM in the next prompt to proceed.')) return;
  var confirm2 = prompt('Type CONFIRM to archive all records:');
  if (!confirm2 || confirm2.trim().toUpperCase() !== 'CONFIRM') { toast('Cancelled \u2014 CONFIRM not entered'); return; }
  _client.from('game_history').update({ archived: true }).eq('archived', false)
    .then(function(res) {
      if (res.error) { toast('Failed: ' + res.error.message); return; }
      toast('All records archived');
    });
}
function hardDeleteArchived() {
  if (!_client || !_connected) { toast('Not connected'); return; }
  if (!confirm('PERMANENTLY DELETE all archived records?\n\nThis cannot be undone.')) return;
  _client.from('game_history').delete().eq('archived', true)
    .then(function(res) {
      if (res.error) { toast('Failed: ' + res.error.message); return; }
      toast('Archived records permanently deleted');
    });
}

/* ── TOAST ── */
var _toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.classList.remove('on'); }, 2800);
}

/* ── SERVICE WORKER ── */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js').catch(function(e) { console.warn(e); });
  });
}

/* ── INIT ── */
initSupabase();
/* No fallback killSplash — error state requires user to press RETRY */
</script>
